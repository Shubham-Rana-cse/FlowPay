name: Settlement Cron

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

jobs:
  settlement:
    runs-on: ubuntu-latest

    steps:
      - name: Call settlement endpoint
        run: |
          curl -X GET \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
          https://flowpay-payment-orchestrator.vercel.app/api/internal/cron/settlement