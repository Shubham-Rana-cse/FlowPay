name: Webhook Retry Cron

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest

    steps:
      - name: Call webhook retry endpoint
        run: |
          curl -X GET \
          -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
          https://flowpay-payment-orchestrator.vercel.app/api/internal/cron/webhook-retry